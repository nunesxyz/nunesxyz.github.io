<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apresentação de Formatura</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }

        #tela-inicial {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #status-carregamento {
            font-size: 1.2rem;
            color: #aaaaaa;
        }

        button {
            padding: 15px 40px;
            font-size: 1.5rem;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
            display: none; /* Aparece só depois que carregar a lista do GitHub */
        }

        button:hover {
            transform: scale(1.05);
            background-color: #e0e0e0;
        }

        #nome-aluno {
            font-size: 5.5vw;
            font-weight: bold;
            letter-spacing: 2px;
            padding: 0 30px;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        #nome-aluno.visivel {
            opacity: 1;
        }

        #barra-progresso-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background-color: #222222;
            display: none;
        }

        #barra-progresso {
            height: 100%;
            width: 0%;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <div id="tela-inicial">
        <div id="status-carregamento">Buscando lista de alunos no GitHub...</div>
        <button id="btn-iniciar">Iniciar Apresentação</button>
    </div>

    <div id="nome-aluno"></div>

    <div id="barra-progresso-container">
        <div id="barra-progresso"></div>
    </div>

    <audio id="player-audio"></audio>

    <script>
        // =====================================================================
        // CONFIGURAÇÕES DO SEU REPOSITÓRIO
        // =====================================================================
        const USUARIO = "nunesxyz";
        const REPOSITORIO = "nunesxyz.github.io";
        const BRANCH = "main";
        const PASTA_RAIZ = "nomes";
        const TEMPO_SEGUNDOS = 30;
        // =====================================================================

        let listaApresentacao = [];
        let indiceAtual = 0;

        const statusCarregamento = document.getElementById('status-carregamento');
        const btnIniciar = document.getElementById('btn-iniciar');
        const telaInicial = document.getElementById('tela-inicial');
        const elementoNome = document.getElementById('nome-aluno');
        const playerAudio = document.getElementById('player-audio');
        const barraContainer = document.getElementById('barra-progresso-container');
        const barraProgresso = document.getElementById('barra-progresso');

        // Busca automaticamente todas as pastas e arquivos MP3 no repositório
        async function carregarDadosDoGitHub() {
            try {
                const urlApi = `https://github.com{USUARIO}/${REPOSITORIO}/git/trees/${BRANCH}?recursive=1`;
                const resposta = await fetch(urlApi);
                
                if (!resposta.ok) {
                    throw new Error("Erro ao acessar a API do GitHub.");
                }

                const dados = await resposta.json();
                const mapaAlunos = new Map();

                // Filtra tudo que está dentro da pasta "nomes/"
                dados.tree.forEach(item => {
                    if (item.path.startsWith(`${PASTA_RAIZ}/`)) {
                        const partes = item.path.split('/');
                        // partes[0] = "nomes"
                        // partes[1] = "Nome do Aluno"
                        // partes[2] = "arquivo.mp3"

                        if (partes.length >= 2 && partes[1]) {
                            const nomeAluno = partes[1];
                            
                            // Garante que o aluno exista na lista mesmo se ainda não tiver mp3
                            if (!mapaAlunos.has(nomeAluno)) {
                                mapaAlunos.set(nomeAluno, null);
                            }

                            // Se for um arquivo .mp3 dentro da pasta do aluno, salva o caminho
                            if (partes.length === 3 && item.type === 'blob' && item.path.toLowerCase().endsWith('.mp3')) {
                                mapaAlunos.set(nomeAluno, item.path);
                            }
                        }
                    }
                });

                // Converte para lista e ordena em ordem alfabética
                listaApresentacao = Array.from(mapaAlunos, ([nome, caminhoAudio]) => ({
                    nome,
                    caminhoAudio
                })).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));

                if (listaApresentacao.length === 0) {
                    statusCarregamento.textContent = "Nenhuma pasta de aluno encontrada em /nomes/.";
                    return;
                }

                statusCarregamento.textContent = `${listaApresentacao.length} aluno(s) carregado(s) com sucesso.`;
                btnIniciar.style.display = 'block';

            } catch (erro) {
                console.error(erro);
                statusCarregamento.textContent = "Erro ao carregar pastas do GitHub. Verifique sua conexão.";
            }
        }

        // Inicia ao clicar no botão
        btnIniciar.addEventListener('click', () => {
            telaInicial.style.display = 'none';
            barraContainer.style.display = 'block';

            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }

            exibirProximoAluno();
        });

        function exibirProximoAluno() {
            if (indiceAtual >= listaApresentacao.length) {
                elementoNome.classList.remove('visivel');
                playerAudio.pause();
                barraContainer.style.display = 'none';

                setTimeout(() => {
                    elementoNome.textContent = "Fim da Apresentação";
                    elementoNome.classList.add('visivel');
                }, 1000);
                return;
            }

            const alunoAtual = listaApresentacao[indiceAtual];
            elementoNome.classList.remove('visivel');

            setTimeout(() => {
                // Exibe o nome exato da pasta
                elementoNome.textContent = alunoAtual.nome;
                elementoNome.classList.add('visivel');

                // Toca o MP3 encontrado dentro da pasta (mesmo com espaços, parênteses ou acentos)
                if (alunoAtual.caminhoAudio) {
                    const caminhoCodificado = alunoAtual.caminhoAudio
                        .split('/')
                        .map(parte => encodeURIComponent(parte))
                        .join('/');

                    playerAudio.src = caminhoCodificado;
                    playerAudio.currentTime = 0;
                    playerAudio.play().catch(err => {
                        console.warn(`Erro ao reproduzir áudio de ${alunoAtual.nome}:`, err);
                    });
                }

                // Animação da barra de progresso
                barraProgresso.style.transition = 'none';
                barraProgresso.style.width = '0%';

                setTimeout(() => {
                    barraProgresso.style.transition = `width ${TEMPO_SEGUNDOS}s linear`;
                    barraProgresso.style.width = '100%';
                }, 50);

                // Aguarda 30 segundos e passa para o próximo
                setTimeout(() => {
                    playerAudio.pause();
                    indiceAtual++;
                    exibirProximoAluno();
                }, TEMPO_SEGUNDOS * 1000);

            }, 800);
        }

        // Executa a busca assim que a página abre
        carregarDadosDoGitHub();
    </script>
</body>
</html>
